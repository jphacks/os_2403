Signin:
  type: object
  properties:
    email:
      type: string
      format: string
      description: "メールアドレス"
      example: "email"
    password:
      type: string
      format: string
      description: "パスワード"
      example: "hogehoge"
  required:
    - email
    - password

Session:
  type: object
  properties:
    uuid:
      type: string
      format: uuid
      description: アカウントのuuid
      example: "hoge"
    account_type:
      type: string
      format: string
      description: アカウントタイプ
      example: "user"
    status:
      type: string
      format: string
      description: 承認済みかのステータス
      example: "authenticated"
  required:
    - uuid
    - account_type
    - status



